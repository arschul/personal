<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Lessons — Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf6ee;
    --paper-deep:#efe7d4;
    --rule:#dccfae;
    --rule-soft:#e9ddc1;
    --ink:#1f3a5f;
    --ink-soft:#4d6886;
    --ink-faint:#92a2b8;
    --rust:#a8462f;
    --rust-soft:#f4ddd3;
    --sage:#3f6b4f;
    --sage-soft:#e0ebe1;
    --gold:#b8862e;
    --gold-soft:#f3e7c7;
    --card:#fffdf7;
    --shadow:0 1px 2px rgba(31,58,95,.07), 0 6px 18px rgba(31,58,95,.07);
    --radius:9px;
    --sidebar-w:228px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'IBM Plex Sans',Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    font-size:15px;
    line-height:1.5;
  }
  .display{font-family:'Fraunces',serif;}
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--gold-soft);}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:var(--sidebar-w);
    flex-shrink:0;
    background:var(--paper-deep);
    border-right:1px solid var(--rule);
    display:flex;
    flex-direction:column;
    position:sticky;
    top:0;
    height:100vh;
  }
  .brand{padding:26px 22px 18px;}
  .brand .title{font-family:'Fraunces',serif;font-weight:600;font-size:1.32rem;letter-spacing:.01em;}
  .brand .sub{display:block;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin-top:3px;}
  .nav{flex:1;padding-top:6px;}
  .nav-tab{
    display:flex;align-items:center;gap:10px;
    padding:11px 22px 11px 26px;
    border-left:4px solid transparent;
    color:var(--ink-soft);
    cursor:pointer;
    font-size:.92rem;
    font-weight:500;
    user-select:none;
  }
  .nav-tab .dot{width:7px;height:7px;border-radius:50%;background:var(--rust);display:none;flex-shrink:0;}
  .nav-tab.has-alert .dot{display:inline-block;}
  .nav-tab:hover{background:rgba(255,253,247,.5);}
  .nav-tab.active{
    background:var(--paper);
    border-left-color:var(--gold);
    color:var(--ink);
    font-weight:600;
    box-shadow:inset 0 1px 0 var(--rule), inset 0 -1px 0 var(--rule);
  }
  .sidebar-foot{padding:14px 22px 22px;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:6px;}
  .foot-link{
    font-size:.78rem;color:var(--ink-soft);cursor:pointer;padding:5px 0;
    display:flex;align-items:center;gap:7px;
  }
  .foot-link:hover{color:var(--ink);}

  /* ---------- Main ---------- */
  .main{flex:1;min-width:0;padding:34px 42px 60px;max-width:1180px;}
  .view{display:none;}
  .view.active{display:block;}
  .view-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
  .view-head h1{font-family:'Fraunces',serif;font-size:1.55rem;font-weight:600;margin:0;}
  .view-head .meta{font-size:.8rem;color:var(--ink-faint);margin-top:2px;}
  .section-label{
    font-size:.7rem;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint);
    font-weight:600;margin:28px 0 10px;
  }
  .section-label:first-child{margin-top:0;}

  /* ---------- Buttons ---------- */
  .btn{
    border-radius:6px;padding:9px 16px;border:1px solid var(--ink);
    background:var(--ink);color:#fff;cursor:pointer;font-size:.84rem;font-weight:600;
    line-height:1;white-space:nowrap;
  }
  .btn:hover{background:var(--ink-soft);border-color:var(--ink-soft);}
  .btn.secondary{background:transparent;color:var(--ink);border-color:var(--rule);}
  .btn.secondary:hover{background:var(--paper-deep);}
  .btn.danger{background:var(--rust);border-color:var(--rust);}
  .btn.danger:hover{background:#8c3a26;}
  .btn.small{padding:5px 11px;font-size:.74rem;border-radius:5px;}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--ink-soft);padding:5px 8px;}
  .btn.ghost:hover{color:var(--ink);}
  .btn[disabled]{opacity:.45;cursor:not-allowed;}
  .action-row{display:flex;gap:7px;flex-wrap:wrap;}

  /* ---------- Stamps / badges ---------- */
  .stamp{
    display:inline-block;padding:4px 11px;border:2px dashed;border-radius:4px;
    font-weight:700;text-transform:uppercase;letter-spacing:.07em;font-size:.7rem;
    transform:rotate(-2.5deg);
  }
  .stamp.due{color:var(--rust);border-color:var(--rust);background:var(--rust-soft);}
  .stamp.paid{color:var(--sage);border-color:var(--sage);background:var(--sage-soft);}
  .stamp.even{color:var(--ink-soft);border-color:var(--ink-faint);background:transparent;transform:none;}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.68rem;font-weight:600;letter-spacing:.02em;}
  .badge.cefr{background:var(--gold-soft);color:#8a611f;}
  .badge.status-active{background:var(--sage-soft);color:var(--sage);}
  .badge.status-paused{background:var(--gold-soft);color:#8a611f;}
  .badge.status-inactive{background:#eee;color:#888;}
  .badge.skill-tag{background:#eef3f8;color:var(--ink-soft);}
  .grade-chip{display:inline-block;padding:2px 8px;border-radius:5px;font-size:.7rem;font-weight:700;margin:2px 4px 2px 0;letter-spacing:.02em;}
  .grade-chip.good{background:var(--sage-soft);color:var(--sage);}
  .grade-chip.mid{background:var(--gold-soft);color:#8a611f;}
  .grade-chip.low{background:var(--rust-soft);color:var(--rust);}
  .grade-chip.none{background:#eee;color:#888;}
  .checkpoint-row{padding:12px 16px;border-bottom:1px solid var(--rule-soft);}
  .checkpoint-row:last-child{border-bottom:none;}
  .checkpoint-row .cp-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .checkpoint-row .cp-date{font-weight:600;font-size:.82rem;}
  .checkpoint-row .cp-chips{display:flex;flex-wrap:wrap;align-items:center;}
  .checkpoint-row .cp-note{font-size:.78rem;color:var(--ink-faint);margin-top:4px;}
  .placement-badge{display:inline-block;padding:5px 14px;border-radius:6px;font-weight:700;font-size:.9rem;background:var(--gold-soft);color:#8a611f;letter-spacing:.01em;}
  .placement-badge.above{background:#ede8f7;color:#5b3fa6;}
  .placement-badge.below{background:var(--rust-soft);color:var(--rust);}
  .pt-session-head{display:flex;justify-content:space-between;align-items:center;margin:12px 0 6px;flex-wrap:wrap;gap:6px;}
  .pt-session-head .lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);font-weight:600;}
  .pt-level-block{margin-bottom:14px;}
  .pt-level-name{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);padding:6px 0 4px;border-bottom:1px solid var(--rule-soft);margin-bottom:4px;}
  .pt-q-row{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--rule-soft);font-size:.78rem;align-items:baseline;}
  .pt-q-row:last-child{border-bottom:none;}
  .pt-q-num{color:var(--ink-faint);flex-shrink:0;width:20px;}
  .pt-q-unit{color:var(--ink-faint);flex-shrink:0;min-width:130px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pt-q-outcome{flex:1;color:var(--ink);}
  .pt-q-score{flex-shrink:0;text-align:right;min-width:90px;font-weight:600;}
  .pt-delta-pos{color:var(--sage);}
  .pt-delta-neg{color:var(--rust);}
  .pt-no-resp{color:var(--ink-faint);font-style:italic;}
  .skill-pin-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
  .skill-pin-btn{
    border:1.5px solid var(--rule);border-radius:20px;padding:5px 13px;
    background:var(--card);color:var(--ink-soft);cursor:pointer;font-size:.78rem;font-weight:500;
    font-family:inherit;
  }
  .skill-pin-btn:hover{border-color:var(--gold);color:var(--ink);}
  .skill-pin-btn.active{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600;}
  .skill-pin-btn.maxed:not(.active){opacity:.45;cursor:not-allowed;}
  .pin-tag{display:inline-block;padding:1px 5px;border-radius:3px;font-size:.6rem;font-weight:700;letter-spacing:.03em;background:var(--gold-soft);color:#8a611f;margin-left:2px;vertical-align:middle;}

  /* ---------- Cards / lists ---------- */
  .card{background:var(--card);border:1px solid var(--rule-soft);border-radius:var(--radius);box-shadow:var(--shadow);}
  .empty{
    border:1px dashed var(--rule);border-radius:var(--radius);padding:30px 22px;
    color:var(--ink-soft);font-size:.9rem;text-align:left;background:rgba(255,253,247,.5);
  }
  .empty .btn{margin-top:12px;}

  .today-row, .owe-row{
    display:flex;align-items:center;gap:14px;padding:13px 16px;border-bottom:1px solid var(--rule-soft);
  }
  .today-row:last-child, .owe-row:last-child{border-bottom:none;}
  .today-row .time{font-weight:600;width:56px;flex-shrink:0;color:var(--ink-soft);font-size:.86rem;}
  .today-row .who{flex:1;min-width:0;}
  .today-row .who .name{font-weight:600;cursor:pointer;}
  .today-row .who .name:hover{text-decoration:underline;}
  .today-row .who .sub{font-size:.76rem;color:var(--ink-faint);}
  .owe-row .who{flex:1;cursor:pointer;}
  .owe-row .who .name{font-weight:600;}
  .owe-row .who .name:hover{text-decoration:underline;}
  .owe-row .who .sub{font-size:.76rem;color:var(--ink-faint);}

  .stat-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:6px;}
  .stat{
    background:var(--card);border:1px solid var(--rule-soft);border-radius:var(--radius);
    padding:14px 18px;min-width:140px;flex:1;
  }
  .stat .num{font-family:'Fraunces',serif;font-size:1.5rem;font-weight:600;}
  .stat .lbl{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-top:2px;}

  /* ---------- Tables ---------- */
  table{width:100%;border-collapse:collapse;}
  th{
    text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;
    color:var(--ink-faint);border-bottom:1px solid var(--rule);padding:8px 8px;font-weight:600;
  }
  td{padding:11px 8px;border-bottom:1px solid var(--rule-soft);font-size:.87rem;vertical-align:middle;}
  tr.muted td{color:var(--ink-faint);}
  .student-row{cursor:pointer;}
  .student-row:hover td{background:rgba(184,134,46,.06);}
  .student-row .name{font-weight:600;color:var(--ink);}
  .right{text-align:right;}
  .center{text-align:center;}

  /* ---------- Filters / search ---------- */
  .filter-bar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
  .chip-filter{
    border:1px solid var(--rule);background:var(--card);padding:6px 13px;border-radius:20px;
    font-size:.78rem;cursor:pointer;color:var(--ink-soft);
  }
  .chip-filter.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  input[type=text].search{
    border:1px solid var(--rule);border-radius:20px;padding:7px 15px;font-size:.84rem;
    background:var(--card);min-width:200px;flex:1;max-width:280px;color:var(--ink);
  }
  input[type=text].search:focus{outline:2px solid var(--gold);outline-offset:1px;}

  /* ---------- Calendar ---------- */
  .cal-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .cal-head .label{font-family:'Fraunces',serif;font-size:1.1rem;font-weight:600;min-width:170px;}
  .cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;margin-bottom:1px;}
  .cal-dow div{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);padding:4px 8px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:6px;overflow:hidden;}
  .cal-cell{background:var(--card);min-height:92px;padding:6px;cursor:pointer;position:relative;}
  .cal-cell:hover{background:#fffaf0;}
  .cal-cell.outside{background:var(--paper-deep);color:var(--ink-faint);}
  .cal-cell.today{box-shadow:inset 0 0 0 2px var(--gold);}
  .cal-cell.selected{box-shadow:inset 0 0 0 2px var(--ink);}
  .cal-cell .date-num{font-size:.74rem;color:var(--ink-faint);font-weight:600;}
  .cal-cell.today .date-num{color:var(--gold);}
  .lesson-chip{
    font-size:.66rem;padding:2px 6px;border-radius:3px;margin-top:3px;display:block;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border:1px solid transparent;
  }
  .lesson-chip.s-scheduled{background:#eef3f8;color:var(--ink-soft);border-color:var(--rule-soft);}
  .lesson-chip.s-completed{background:var(--sage-soft);color:var(--sage);}
  .lesson-chip.s-no-show{background:var(--rust-soft);color:var(--rust);}
  .lesson-chip.s-cancelled{background:transparent;color:var(--ink-faint);text-decoration:line-through;border-style:dashed;border-color:var(--rule);}

  .agenda{margin-top:22px;}
  .agenda-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .agenda-head h3{font-family:'Fraunces',serif;font-size:1.02rem;font-weight:600;margin:0;}

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(31,38,48,.42);display:none;align-items:stretch;justify-content:flex-end;z-index:50;
  }
  .overlay.show{display:flex;}
  .panel{
    background:var(--paper);width:480px;max-width:100%;height:100%;overflow-y:auto;
    padding:30px 30px 50px;box-shadow:-8px 0 24px rgba(0,0,0,.18);
    border-left:1px solid var(--rule);
  }
  .panel.center-modal{
    margin:auto;height:auto;max-height:90vh;width:420px;border-radius:var(--radius);
    border:1px solid var(--rule);box-shadow:var(--shadow);
  }
  .panel-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;}
  .panel-head h2{font-family:'Fraunces',serif;font-size:1.25rem;font-weight:600;margin:0;}
  .close-x{cursor:pointer;color:var(--ink-faint);font-size:1.3rem;line-height:1;padding:0 4px;}
  .close-x:hover{color:var(--ink);}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);font-weight:600;margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%;padding:9px 11px;border:1px solid var(--rule);border-radius:6px;font-size:.88rem;
    background:var(--card);color:var(--ink);font-family:inherit;
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold);}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .field textarea{resize:vertical;min-height:60px;}
  .checkbox-field{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .checkbox-field input{width:auto;}
  .checkbox-field label{margin:0;text-transform:none;letter-spacing:0;font-weight:500;font-size:.86rem;color:var(--ink);}
  .form-actions{display:flex;justify-content:space-between;margin-top:22px;gap:10px;}
  .form-actions .left{display:flex;gap:8px;}
  fieldset{border:1px solid var(--rule-soft);border-radius:8px;padding:14px;margin:0 0 16px;}
  fieldset legend{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);font-weight:600;padding:0 4px;}

  /* ---------- Toast ---------- */
  .toast-host{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:8px;z-index:80;}
  .toast{
    background:var(--ink);color:#fff;padding:11px 18px;border-radius:7px;font-size:.83rem;
    box-shadow:var(--shadow);max-width:320px;animation:toastIn .18s ease-out;
  }
  .toast.error{background:var(--rust);}
  @keyframes toastIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  @media (max-width:760px){
    body{flex-direction:column;}
    .sidebar{width:100%;height:auto;position:relative;flex-direction:row;overflow-x:auto;}
    .brand{display:none;}
    .nav{display:flex;padding:0;}
    .nav-tab{border-left:none;border-bottom:3px solid transparent;padding:13px 16px;}
    .nav-tab.active{border-left:none;border-bottom-color:var(--gold);}
    .sidebar-foot{display:none;}
    .main{padding:22px 16px 50px;}
    .panel{width:100%;}
    .stat-row{flex-direction:column;}
  }
  @media (prefers-reduced-motion: reduce){
    .toast{animation:none;}
  }
</style>
</head>
<body>

<div class="sidebar">
  <div class="brand">
    <span class="title">Private Lessons</span>
    <span class="sub">Ledger</span>
  </div>
  <div class="nav">
    <div class="nav-tab active" data-action="nav" data-view="dashboard">Dashboard <span class="dot"></span></div>
    <div class="nav-tab" data-action="nav" data-view="students">Students</div>
    <div class="nav-tab" data-action="nav" data-view="calendar">Calendar</div>
    <div class="nav-tab" data-action="nav" data-view="payments">Payments</div>
  </div>
  <div class="sidebar-foot">
    <div class="foot-link" data-action="export-data">⤓ Export data</div>
    <div class="foot-link" data-action="open-import">⤒ Import data</div>
    <div class="foot-link" data-action="open-settings">⚙ Settings</div>
  </div>
</div>

<div class="main">

  <div id="view-dashboard" class="view active"></div>
  <div id="view-students" class="view"></div>
  <div id="view-calendar" class="view"></div>
  <div id="view-payments" class="view"></div>

</div>

<div class="overlay" id="overlay">
  <div class="panel" id="panel-content"></div>
</div>

<input type="file" id="import-file-input" accept=".json,application/json" style="display:none;">
<input type="file" id="placement-import-input" accept=".json,application/json" style="display:none;">

<div class="toast-host" id="toast-host"></div>

<script>
/* =========================================================
   STATE
   ========================================================= */
const STORAGE_KEY = 'privateLessonsLedger_v1';
const RECUR_HORIZON_WEEKS = 8;
const LESSON_STATUSES = ['scheduled','completed','no-show','cancelled'];
const DOW_LABELS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const SKILLS = [
  { key:'speaking', label:'Speaking', abbr:'Spk' },
  { key:'reading', label:'Reading', abbr:'Rea' },
  { key:'writing', label:'Writing', abbr:'Wri' },
  { key:'listening', label:'Listening', abbr:'Lis' },
  { key:'vocabulary', label:'Vocabulary', abbr:'Voc' },
  { key:'pronunciation', label:'Pronunciation', abbr:'Pron' },
  { key:'grammar', label:'Grammar', abbr:'Gram' }
];
const GRADE_LETTERS = ['A','B','C','D','F'];
function gradeTier(letter){
  if(letter==='A' || letter==='B') return 'good';
  if(letter==='C') return 'mid';
  if(letter==='D' || letter==='F') return 'low';
  return 'none';
}

function defaultState(){
  return {
    students: [],
    lessons: [],
    payments: [],
    checkpoints: [],
    learningPoints: [],
    settings: { overdueThresholdDays: 14 }
  };
}

let state = loadState();
let currentView = 'dashboard';
let calMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
let calSelectedDate = todayStr();
let studentFilter = 'active';
let studentSearch = '';

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const d = defaultState();
    const students = (Array.isArray(parsed.students) ? parsed.students : d.students).map(s=>{
      if(s.recurring && !Array.isArray(s.recurring)){
        return Object.assign({}, s, { recurring: [s.recurring] });
      }
      return s;
    });
    return {
      students,
      lessons: Array.isArray(parsed.lessons) ? parsed.lessons : d.lessons,
      payments: Array.isArray(parsed.payments) ? parsed.payments : d.payments,
      checkpoints: Array.isArray(parsed.checkpoints) ? parsed.checkpoints : d.checkpoints,
      learningPoints: Array.isArray(parsed.learningPoints) ? parsed.learningPoints : d.learningPoints,
      settings: Object.assign({}, d.settings, parsed.settings||{})
    };
  }catch(e){
    console.error('Failed to load saved data', e);
    return defaultState();
  }
}

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    console.error(e);
    toast('Could not save — your browser storage may be full or blocked.', true);
  }
}

/* =========================================================
   HELPERS
   ========================================================= */
function genId(){ return 'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8); }

function esc(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function toLocalDateStr(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayStr(){ return toLocalDateStr(new Date()); }
function parseDate(str){
  const [y,m,d] = str.split('-').map(Number);
  return new Date(y, m-1, d);
}
function daysBetween(a,b){ return Math.round((parseDate(a) - parseDate(b)) / 86400000); }
function fmtDateLong(str){
  const d = parseDate(str);
  return d.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
}
function fmtDateShort(str){
  const d = parseDate(str);
  return d.toLocaleDateString('en-GB', { day:'2-digit', month:'2-digit', year:'numeric' });
}
function fmtTime(t){ return t || '—'; }

function fmtMoney(n){
  const v = Number(n)||0;
  const neg = v < 0;
  const abs = Math.abs(v).toFixed(2);
  let [intPart, decPart] = abs.split('.');
  intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return (neg?'-':'') + 'R$ ' + intPart + ',' + decPart;
}

function getStudent(id){ return state.students.find(s=>s.id===id); }

function toast(msg, isError){
  const host = document.getElementById('toast-host');
  const el = document.createElement('div');
  el.className = 'toast' + (isError?' error':'');
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 3200);
}

/* =========================================================
   PRICING / LEDGER LOGIC
   ========================================================= */
function lessonCost(student){
  if(!student) return 0;
  if(student.pricingType === 'package'){
    const size = Number(student.packageSize)||0;
    const price = Number(student.packagePrice)||0;
    return size>0 ? price/size : 0;
  }
  return Number(student.rate)||0;
}

function computeLedger(studentId){
  const student = getStudent(studentId);
  const billable = state.lessons
    .filter(l => l.studentId===studentId && (l.status==='completed' || l.status==='no-show'))
    .sort((a,b)=> a.date===b.date ? (a.time||'').localeCompare(b.time||'') : a.date.localeCompare(b.date));
  const cost = lessonCost(student);
  const totalBilled = billable.length * cost;
  const totalPaid = state.payments
    .filter(p => p.studentId===studentId)
    .reduce((sum,p) => sum + (Number(p.amount)||0), 0);
  const balance = round2(totalBilled - totalPaid);

  let remaining = totalPaid;
  let oldestUnpaidDate = null;
  for(const l of billable){
    if(cost<=0){ continue; }
    if(remaining >= cost - 0.005){
      remaining -= cost;
    } else {
      oldestUnpaidDate = l.date;
      break;
    }
  }
  const threshold = Number(state.settings.overdueThresholdDays)||14;
  let overdue = false;
  if(oldestUnpaidDate && balance > 0.005){
    overdue = daysBetween(todayStr(), oldestUnpaidDate) >= threshold;
  }
  return { totalBilled, totalPaid, balance, oldestUnpaidDate, overdue, lessonsBilled: billable.length, cost };
}

function round2(n){ return Math.round(n*100)/100; }

function nextLessonForStudent(studentId){
  return state.lessons
    .filter(l => l.studentId===studentId && l.status==='scheduled' && l.date >= todayStr())
    .sort((a,b)=> a.date===b.date ? (a.time||'').localeCompare(b.time||'') : a.date.localeCompare(b.date))[0] || null;
}

/* =========================================================
   RECURRING LESSON GENERATION
   ========================================================= */
function nextOccurrences(weekday, count, fromDateStr){
  let d = parseDate(fromDateStr);
  let guard = 0;
  while(d.getDay() !== weekday && guard < 8){ d.setDate(d.getDate()+1); guard++; }
  const out = [];
  for(let i=0;i<count;i++){
    out.push(toLocalDateStr(d));
    d.setDate(d.getDate()+7);
  }
  return out;
}

function topUpRecurring(student){
  if(student.status !== 'active' || !student.recurring || !student.recurring.length) return;
  student.recurring.forEach(slot=>{
    const targets = nextOccurrences(slot.weekday, RECUR_HORIZON_WEEKS, todayStr());
    targets.forEach(dateStr=>{
      const exists = state.lessons.some(l => l.studentId===student.id && l.date===dateStr && l.time===slot.time && l.isRecurring);
      if(!exists){
        state.lessons.push({
          id: genId(),
          studentId: student.id,
          date: dateStr,
          time: slot.time || '',
          duration: slot.duration || 60,
          status: 'scheduled',
          isRecurring: true,
          notes: ''
        });
      }
    });
  });
}

function regenerateRecurring(student){
  // remove future, untouched recurring placeholders, then top up fresh
  state.lessons = state.lessons.filter(l =>
    !(l.studentId===student.id && l.isRecurring && l.status==='scheduled' && l.date >= todayStr())
  );
  topUpRecurring(student);
}

function topUpAllRecurring(){
  state.students.forEach(s => topUpRecurring(s));
}

    .sort((a,b)=> (a.time||'').localeCompare(b.time||''));

  const todayHTML = todaysLessons.length ? todaysLessons.map(l=>{
    const s = getStudent(l.studentId);
    const pinHTML = (s && s.pinnedSkills && s.pinnedSkills.length)
      ? ' · ' + s.pinnedSkills.map(k=>{ const sk=SKILLS.find(x=>x.key===k); return sk?`<span class="pin-tag">${sk.label}</span>`:''; }).join(' ')
      : '';
    return `
      <div class="today-row">
        <div class="time">${esc(fmtTime(l.time))}</div>
        <div class="who">
          <div class="name" data-action="open-student" data-id="${s?s.id:''}">${esc(s?s.name:'Unknown')}</div>
          <div class="sub">${esc(s?s.cefr||'':'')} · ${l.duration||60} min ${l.status!=='scheduled' ? '· '+esc(l.status) : ''}${pinHTML}</div>
        </div>
        ${l.status==='scheduled' ? `
        <div class="action-row">
          <button class="btn small secondary" data-action="set-lesson-status" data-id="${l.id}" data-status="completed">✓ Complete</button>
          <button class="btn small secondary" data-action="set-lesson-status" data-id="${l.id}" data-status="no-show">No-show</button>
          <button class="btn small ghost" data-action="set-lesson-status" data-id="${l.id}" data-status="cancelled">Cancel</button>
        </div>` : `<div class="action-row"><button class="btn small ghost" data-action="open-lesson" data-id="${l.id}">Edit</button></div>`}
      </div>`;
  }).join('') : `<div class="empty">No lessons today.</div>`;

  const owing = state.students
    .map(s => ({ s, ledger: computeLedger(s.id) }))
    .filter(x => x.ledger.balance > 0.5 && x.s.status!=='inactive')
    .sort((a,b)=> (b.ledger.overdue - a.ledger.overdue) || (b.ledger.balance - a.ledger.balance));

  const oweHTML = owing.length ? owing.map(x=>`
    <div class="owe-row">
      <div class="who" data-action="open-student" data-id="${x.s.id}">
        <div class="name">${esc(x.s.name)}</div>
        <div class="sub">${x.ledger.lessonsBilled} lesson${x.ledger.lessonsBilled===1?'':'s'} billed</div>
      </div>
      <div class="stamp ${x.ledger.overdue?'due':'even'}">${x.ledger.overdue?'Due':'Owes'}</div>
      <div style="min-width:90px;text-align:right;font-weight:600;">${fmtMoney(x.ledger.balance)}</div>
    </div>
  `).join('') : `<div class="empty">Everyone's settled up.</div>`;

  const thisWeekStart = weekStartOf(new Date());
  const thisWeekEnd = new Date(thisWeekStart); thisWeekEnd.setDate(thisWeekEnd.getDate()+6);
  const wkStartStr = toLocalDateStr(thisWeekStart), wkEndStr = toLocalDateStr(thisWeekEnd);
  const weekLessons = state.lessons.filter(l => l.date>=wkStartStr && l.date<=wkEndStr);
  const completedThisWeek = weekLessons.filter(l=>l.status==='completed').length;
  const scheduledRemaining = weekLessons.filter(l=>l.status==='scheduled' && l.date>=todayStr()).length;

  const thisMonth = todayStr().slice(0,7);
  const receivedThisMonth = state.payments
    .filter(p=>p.date.slice(0,7)===thisMonth)
    .reduce((s,p)=>s+(Number(p.amount)||0),0);

  document.getElementById('view-dashboard').innerHTML = `
    <div class="view-head">
      <div>
        <h1>Dashboard</h1>
        <div class="meta">${new Date().toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'long'})}</div>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat"><div class="num">${todaysLessons.length}</div><div class="lbl">Lessons today</div></div>
      <div class="stat"><div class="num">${scheduledRemaining}</div><div class="lbl">Scheduled, this week</div></div>
      <div class="stat"><div class="num">${completedThisWeek}</div><div class="lbl">Held, this week</div></div>
      <div class="stat"><div class="num">${fmtMoney(receivedThisMonth)}</div><div class="lbl">Received this month</div></div>
    </div>

    <div class="section-label">Today</div>
    <div class="card">${todayHTML}</div>

    <div class="section-label">Who owes</div>
    <div class="card">${oweHTML}</div>
  `;
}

function weekStartOf(date){
  const d = new Date(date);
  d.setDate(d.getDate() - d.getDay()); // getDay()===0 is Sunday
  d.setHours(0,0,0,0);
  return d;
}

/* =========================================================
   RENDER: STUDENTS
   ========================================================= */
function renderStudents(){
  let list = state.students.slice();
  if(studentFilter!=='all') list = list.filter(s=>s.status===studentFilter);
  if(studentSearch.trim()){
    const q = studentSearch.trim().toLowerCase();
    list = list.filter(s=>s.name.toLowerCase().includes(q));
  }
  list.sort((a,b)=>a.name.localeCompare(b.name));

  const rows = list.map(s=>{
    const ledger = computeLedger(s.id);
    const next = nextLessonForStudent(s.id);
    let stampClass = 'even', stampLabel = 'Even';
    if(ledger.balance > 0.5){ stampClass = ledger.overdue ? 'due' : 'even'; stampLabel = ledger.overdue ? 'Due' : 'Owes'; }
    else if(ledger.balance < -0.5){ stampClass = 'paid'; stampLabel = 'Credit'; }
    return `
      <tr class="student-row" data-action="open-student" data-id="${s.id}">
        <td><span class="name">${esc(s.name)}</span></td>
        <td><span class="badge cefr">${esc(s.cefr||'—')}</span></td>
        <td><span class="badge status-${s.status}">${esc(s.status)}</span></td>
        <td>${next ? esc(fmtDateLong(next.date))+' '+esc(next.time||'') : '<span style="color:var(--ink-faint)">—</span>'}</td>
        <td class="right">${fmtMoney(ledger.balance)} <span class="stamp ${stampClass}" style="margin-left:6px;">${stampLabel}</span></td>
      </tr>`;
  }).join('');

  const filters = ['active','paused','inactive','all'];
  const filterHTML = filters.map(f=>`<div class="chip-filter ${studentFilter===f?'active':''}" data-action="set-student-filter" data-filter="${f}">${f[0].toUpperCase()+f.slice(1)}</div>`).join('');

  document.getElementById('view-students').innerHTML = `
    <div class="view-head">
      <div><h1>Students</h1><div class="meta">${state.students.length} total</div></div>
      <button class="btn" data-action="open-student" data-id="">+ New student</button>
    </div>
    <div class="filter-bar">
      ${filterHTML}
      <input type="text" class="search" placeholder="Search by name…" id="student-search" value="${esc(studentSearch)}">
    </div>
    ${list.length ? `
    <table>
      <thead><tr><th>Name</th><th>Level</th><th>Status</th><th>Next lesson</th><th class="right">Balance</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>` : `<div class="empty">No students match this view. ${state.students.length===0 ? 'Add your first student to start tracking lessons and payments.' : ''}
      <div><button class="btn small" data-action="open-student" data-id="">+ New student</button></div>
    </div>`}
  `;

  const searchEl = document.getElementById('student-search');
  if(searchEl){
    searchEl.addEventListener('input', e=>{ studentSearch = e.target.value; renderStudents(); preserveFocus('student-search'); });
  }
}

function preserveFocus(id){
  requestAnimationFrame(()=>{
    const el = document.getElementById(id);
    if(el){ el.focus(); const v=el.value; el.value=''; el.value=v; }
  });
}

/* =========================================================
   RENDER: CALENDAR
   ========================================================= */
function renderCalendar(){
  const year = calMonth.getFullYear(), month = calMonth.getMonth();
  const first = new Date(year, month, 1);
  const startOffset = first.getDay(); // Sunday=0, so this is days to step back to the prior Sunday
  const gridStart = new Date(first); gridStart.setDate(gridStart.getDate()-startOffset);
  const cells = [];
  for(let i=0;i<42;i++){
    const d = new Date(gridStart); d.setDate(d.getDate()+i);
    cells.push(d);
  }
  const studentMap = {}; state.students.forEach(s=>studentMap[s.id]=s);

  const cellsHTML = cells.map(d=>{
    const dateStr = toLocalDateStr(d);
    const outside = d.getMonth()!==month;
    const isToday = dateStr===todayStr();
    const isSelected = dateStr===calSelectedDate;
    const dayLessons = state.lessons.filter(l=>l.date===dateStr).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    const chips = dayLessons.slice(0,4).map(l=>{
      const s = studentMap[l.studentId];
      const pins = (s && s.pinnedSkills && s.pinnedSkills.length)
        ? s.pinnedSkills.map(k=>{ const sk=SKILLS.find(x=>x.key===k); return sk?`<span class="pin-tag">${sk.abbr}</span>`:''; }).join('')
        : '';
      return `<div class="lesson-chip s-${l.status}" data-action="open-lesson" data-id="${l.id}">${esc(l.time||'')} ${esc(s?s.name.split(' ')[0]:'?')}${pins}</div>`;
    }).join('');
    const more = dayLessons.length>4 ? `<div class="lesson-chip">+${dayLessons.length-4} more</div>` : '';
    return `<div class="cal-cell ${outside?'outside':''} ${isToday?'today':''} ${isSelected?'selected':''}" data-action="select-day" data-date="${dateStr}">
      <div class="date-num">${d.getDate()}</div>
      ${chips}${more}
    </div>`;
  }).join('');

  const monthLabel = calMonth.toLocaleDateString('en-GB',{month:'long', year:'numeric'});

  document.getElementById('view-calendar').innerHTML = `
    <div class="view-head">
      <h1>Calendar</h1>
    </div>
    <div class="cal-head">
      <button class="btn small secondary" data-action="cal-prev">‹</button>
      <div class="label">${monthLabel}</div>
      <button class="btn small secondary" data-action="cal-next">›</button>
      <button class="btn small ghost" data-action="cal-today">Today</button>
    </div>
    <div class="cal-dow">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div>${d}</div>`).join('')}</div>
    <div class="cal-grid">${cellsHTML}</div>
    <div class="agenda" id="agenda-host"></div>
  `;
  renderAgenda();
}

const PT_URL = 'https://arschul.github.io/tools/placement-test.html';
const PT_SK_PREFIX = 'efl-dashboard:placement:';
const SCHOOL_LEVELS = ['Starter','Basic 1','Basic 2','Basic 3','Basic 4','Intermediate 1','Intermediate 2','Intermediate 3','Intermediate 4'];

function getPlacementHistory(studentId){
  try{
    const raw = localStorage.getItem(PT_SK_PREFIX + studentId);
    if(!raw) return null;
    const data = JSON.parse(raw);
    if(Array.isArray(data.history) && data.history.length) return data.history;
    if(data.placement !== undefined || data.name !== undefined) return [data]; // legacy
    return null;
  }catch{ return null; }
}

function placementBadgeClass(level){
  if(!level) return '';
  if(level.toLowerCase().includes('above')) return 'above';
  if(level.toLowerCase().includes('below')) return 'below';
  return '';
}

function renderPlacementSection(studentId, studentName){
  const history = getPlacementHistory(studentId);
  const ptLink = `${PT_URL}?studentId=${encodeURIComponent(studentId)}&name=${encodeURIComponent(studentName)}`;

  if(!history){
    return `
      <div class="section-label" style="display:flex;justify-content:space-between;align-items:center;">
        <span>Placement test</span>
        <a href="${ptLink}" target="_blank" class="btn small secondary">Open test ↗</a>
      </div>
      <div class="empty" style="font-size:.82rem;">
        No results on record.
        <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">
          <a href="${ptLink}" target="_blank" class="btn small">Run placement test ↗</a>
          <button class="btn small secondary" data-action="import-placement-json" data-student="${studentId}">Import JSON</button>
          <button class="btn small ghost" data-action="pull-placement" data-id="${studentId}" data-name="${esc(studentName)}">↻ Pull results</button>
        </div>
      </div>`;
  }

  const latest = history[history.length - 1];
  const original = history[0];
  const isRetest = history.length > 1;

  // Build per-level comparison
  const levelBlocks = SCHOOL_LEVELS.map(lvl => {
    const latestScores = latest.scores && latest.scores[lvl];
    const origScores = isRetest && original.scores && original.scores[lvl];
    if(!latestScores) return '';
    const hasAny = latestScores.some(s => s && (s.score !== null || s.unit || s.outcome)) || !!(PT_QB[lvl] && PT_QB[lvl].length);
    if(!hasAny) return '';

    const rows = latestScores.map((entry, i) => {
      if(!entry) return '';
      const origEntry = origScores && origScores[i];
      const prevScore = (origEntry && origEntry.score !== null && origEntry.score !== undefined) ? origEntry.score : null;
      const curScore = (entry.score !== null && entry.score !== undefined) ? entry.score : null;
      const qNum = i + 1;
      const qbEntry = PT_QB[lvl] && PT_QB[lvl][i];
      const unit = entry.unit || (origEntry && origEntry.unit) || (qbEntry && qbEntry.unit) || '';
      const outcome = entry.outcome || (origEntry && origEntry.outcome) || (qbEntry && qbEntry.outcome) || '';
      // Skip if nothing to show at all
      if(curScore === null && prevScore === null && !unit && !outcome) return '';

      let scoreHTML = '';
      if(curScore === null){
        scoreHTML = `<span class="pt-no-resp">No response</span>`;
        if(prevScore !== null) scoreHTML += ` <span style="color:var(--ink-faint);font-size:.72rem;">(was ${prevScore}%)</span>`;
      } else if(prevScore !== null && prevScore !== curScore){
        const delta = curScore - prevScore;
        const sign = delta > 0 ? '+' : '';
        const cls = delta > 0 ? 'pt-delta-pos' : 'pt-delta-neg';
        scoreHTML = `<span style="color:var(--ink-faint)">${prevScore}%</span> → <strong>${curScore}%</strong> <span class="${cls}">(${sign}${delta})</span>`;
      } else {
        scoreHTML = `<strong>${curScore !== null ? curScore+'%' : '—'}</strong>`;
      }
      return `<div class="pt-q-row">
        <span class="pt-q-num">${qNum}</span>
        <span class="pt-q-unit" title="${esc(unit)}">${esc(unit)}</span>
        <span class="pt-q-outcome">${esc(outcome)}</span>
        <span class="pt-q-score">${scoreHTML}</span>
      </div>`;
    }).filter(Boolean).join('');

    if(!rows) return '';
    return `<div class="pt-level-block"><div class="pt-level-name">${esc(lvl)}</div>${rows}</div>`;
  }).filter(Boolean).join('');

  const sessionMeta = history.map((r, i) => {
    const d = r.testDate ? new Date(r.testDate).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : '—';
    const label = i === 0 && history.length > 1 ? 'Original' : i === history.length - 1 && history.length > 1 ? `Retest ${i}` : `Session ${i+1}`;
    return `<span style="font-size:.74rem;color:var(--ink-faint);">${label}: <strong>${esc(r.placement||'—')}</strong> · ${d}</span>`;
  }).join('<br>');

  return `
    <div class="section-label" style="display:flex;justify-content:space-between;align-items:center;">
      <span>Placement test</span>
      <div style="display:flex;gap:6px;">
        <button class="btn small ghost" data-action="pull-placement" data-id="${studentId}" data-name="${esc(studentName)}">↻ Refresh</button>
        <button class="btn small secondary" data-action="import-placement-json" data-student="${studentId}">Import JSON</button>
        <a href="${ptLink}" target="_blank" class="btn small secondary">Retest ↗</a>
      </div>
    </div>
    <div class="card" style="padding:14px 16px;">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px;">
        <span class="placement-badge ${placementBadgeClass(latest.placement)}">${esc(latest.placement||'—')}</span>
        <div style="font-size:.76rem;line-height:1.8;">${sessionMeta}</div>
      </div>
      ${levelBlocks || '<div style="color:var(--ink-faint);font-size:.82rem;">No scored questions on record.</div>'}
    </div>`;
}

      <h2 class="display">${isNew?'Add lesson':'Edit lesson'}</h2>
      <span class="close-x" data-action="close-modal">✕</span>
    </div>

      <div class="field"><label>Student</label>
        <select name="studentId" required ${!isNew?'':''}>

      <div class="field-row">
        <div class="field"><label>Date</label><input type="date" name="date" value="${l.date}" required></div>
        <div class="field"><label>Time</label><input type="time" name="time" value="${l.time||''}"></div>

      <div class="field-row">

      <div class="form-actions">

        </div>

/* =========================================================
   EVENT DELEGATION
   ========================================================= */
document.addEventListener('click', function(e){
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;

  if(action==='nav'){
    currentView = t.dataset.view; renderAll(); return;
  }
  if(action==='close-modal'){ closeOverlay(); return; }
  if(action==='toggle-skill-pin'){
    const s = getStudent(t.dataset.student);
    if(!s) return;
    s.pinnedSkills = s.pinnedSkills || [];
    const skill = t.dataset.skill;
    const idx = s.pinnedSkills.indexOf(skill);
    if(idx >= 0){
      s.pinnedSkills.splice(idx, 1);
    } else {
      if(s.pinnedSkills.length >= 3){ toast('Maximum 3 focus skills.'); return; }
      s.pinnedSkills.push(skill);
    }
    saveState();
    // Update buttons in-place without closing the panel
    document.querySelectorAll('.skill-pin-btn').forEach(btn=>{
      const pinned = s.pinnedSkills.includes(btn.dataset.skill);
      const maxed = !pinned && s.pinnedSkills.length >= 3;
      btn.classList.toggle('active', pinned);
      btn.classList.toggle('maxed', maxed);
    });
    renderAll(); // refreshes calendar chips
    return;
  }
  if(action==='open-student'){ openStudentPanel(t.dataset.id || null); return; }
  if(action==='delete-student'){
    if(confirm('Delete this student? Their lesson and payment history will also be removed. This cannot be undone.')){
      const id = t.dataset.id;
      state.students = state.students.filter(s=>s.id!==id);
      state.lessons = state.lessons.filter(l=>l.studentId!==id);
      state.payments = state.payments.filter(p=>p.studentId!==id);
      saveState(); closeOverlay(); renderAll(); toast('Student deleted.');
    }
    return;
  }
  if(action==='set-student-filter'){ studentFilter = t.dataset.filter; renderStudents(); return; }

  if(action==='open-lesson'){
    openLessonModal(t.dataset.id || null, t.dataset.student || null, t.dataset.date || null); return;
  }
  if(action==='delete-lesson'){
    if(confirm('Delete this lesson record?')){
      state.lessons = state.lessons.filter(l=>l.id!==t.dataset.id);
      saveState(); closeOverlay(); renderAll(); toast('Lesson deleted.');
    }
    return;
  }
  if(action==='set-lesson-status'){
    const l = state.lessons.find(x=>x.id===t.dataset.id);
    if(l){ l.status = t.dataset.status; saveState(); renderAll(); }
    return;
  }

  if(action==='open-payment'){ openPaymentModal(t.dataset.id || null, t.dataset.student || null); return; }
  if(action==='delete-payment'){
    if(confirm('Delete this payment record?')){
      state.payments = state.payments.filter(p=>p.id!==t.dataset.id);
      saveState(); closeOverlay(); renderAll(); toast('Payment deleted.');
    }
    return;
  }

  if(action==='open-checkpoint'){ openCheckpointModal(t.dataset.id || null, t.dataset.student || null); return; }
  if(action==='delete-checkpoint'){
    if(confirm('Delete this checkpoint?')){
      state.checkpoints = state.checkpoints.filter(c=>c.id!==t.dataset.id);
      saveState(); renderAll();
      openStudentPanel(t.dataset.student);
      toast('Checkpoint deleted.');
    }
    return;
  }
  if(action==='open-learning-point'){ openLearningPointModal(t.dataset.id || null, t.dataset.student || null); return; }
  if(action==='delete-learning-point'){
    if(confirm('Delete this learning point?')){
      state.learningPoints = state.learningPoints.filter(p=>p.id!==t.dataset.id);
      saveState(); renderAll();
      openStudentPanel(t.dataset.student);
      toast('Learning point deleted.');
    }
    return;
  }

  if(action==='select-day'){ calSelectedDate = t.dataset.date; renderCalendar(); return; }
  if(action==='cal-prev'){ calMonth.setMonth(calMonth.getMonth()-1); renderCalendar(); return; }
  if(action==='cal-next'){ calMonth.setMonth(calMonth.getMonth()+1); renderCalendar(); return; }
  if(action==='cal-today'){ calMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1); calSelectedDate = todayStr(); renderCalendar(); return; }

  if(action==='open-settings'){ openSettingsModal(); return; }
  if(action==='clear-all-data'){
    if(confirm('This will permanently erase ALL students, lessons and payments. Type-safe second check next.') && confirm('Are you absolutely sure? This cannot be undone.')){
      state = defaultState(); saveState(); closeOverlay(); renderAll(); toast('All data erased.');
    }
    return;
  }
  if(action==='pull-placement'){
    // Re-render the student panel — renderPlacementSection reads fresh from localStorage each time
    const studentId = t.dataset.id;
    const history = getPlacementHistory(studentId);
    if(history) toast('Results loaded.');
    else toast('No results found — run the test first, or use Import JSON.', true);
    openStudentPanel(studentId);
    return;
  }
  if(action==='import-placement-json'){
    const inp = document.getElementById('placement-import-input');
    inp.dataset.student = t.dataset.student;
    inp.click();
    return;
  }
  if(action==='export-data'){ exportData(); return; }
  if(action==='add-recurring-slot'){
    const container = document.getElementById('recurring-slots');
    if(container) container.insertAdjacentHTML('beforeend', recurringSlotRowHTML(null));
    return;
  }
  if(action==='remove-recurring-slot'){
    const row = t.closest('.recurring-slot-row');
    if(row) row.remove();
    return;
  }
  if(action==='open-import'){ openImportModal(); return; }
});

document.addEventListener('change', function(e){
  if(e.target.name==='isMinor'){
    const wrap = e.target.closest('form').querySelector('.guardian-fields');
    if(wrap) wrap.style.display = e.target.checked ? '' : 'none';
  }
  if(e.target.name==='pricingType'){
    const form = e.target.closest('form');
    form.querySelector('.pricing-perlesson').style.display = e.target.value==='package' ? 'none' : '';
    form.querySelector('.pricing-package').style.display = e.target.value==='package' ? '' : 'none';
  }
  if(e.target.id==='placement-import-input'){
    const studentId = e.target.dataset.student;
    const file = e.target.files[0];
    if(!file || !studentId) return;
    const reader = new FileReader();
    reader.onload = function(ev){
      try{
        const parsed = JSON.parse(ev.target.result);
        // Accept both { history:[...] } and a single record
        let history = [];
        if(Array.isArray(parsed.history) && parsed.history.length){
          history = parsed.history;
        } else if(parsed.placement !== undefined || parsed.name !== undefined){
          history = [parsed];
        } else {
          throw new Error('unrecognised format');
        }
        // Merge with any existing history (avoid duplicating by testDate)
        const existing = getPlacementHistory(studentId) || [];
        const existingDates = new Set(existing.map(r=>r.testDate));
        const toAdd = history.filter(r => !existingDates.has(r.testDate));
        const merged = [...existing, ...toAdd].sort((a,b)=>(a.testDate||'').localeCompare(b.testDate||''));
        localStorage.setItem(PT_SK_PREFIX + studentId, JSON.stringify({ history: merged }));
        openStudentPanel(studentId);
        toast(`Placement data imported (${merged.length} session${merged.length===1?'':'s'}).`);
      }catch(err){
        toast('Could not read that file — is it a placement test export?', true);
      }
      e.target.value = '';
    };
    reader.readAsText(file);
    return;
  }
  if(e.target.id==='import-file-input'){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(ev){
      try{
        const parsed = JSON.parse(ev.target.result);
        if(!parsed || !Array.isArray(parsed.students)){ throw new Error('bad format'); }
        if(confirm('Import will replace all current data with the contents of this file. Continue?')){
          state = {
            students: parsed.students||[],
            lessons: parsed.lessons||[],
            payments: parsed.payments||[],
            checkpoints: parsed.checkpoints||[],
            learningPoints: parsed.learningPoints||[],
            settings: Object.assign({overdueThresholdDays:14}, parsed.settings||{})
          };
          saveState(); renderAll(); toast('Data imported.');
        }
      }catch(err){
        toast('Could not read that file — is it a valid export?', true);
      }
      e.target.value = '';
    };
    reader.readAsText(file);
  }
});

document.addEventListener('submit', function(e){
  const form = e.target.closest('[data-form]');
  if(!form) return;
  e.preventDefault();
  const kind = form.dataset.form;
  const fd = new FormData(form);

  if(kind==='student'){
    const id = form.dataset.id;
    let s = getStudent(id);
    const isNew = !s;
    if(isNew){ s = { id }; state.students.push(s); }
    s.name = (fd.get('name')||'').trim();
    s.contactPhone = fd.get('contactPhone')||'';
    s.cefr = fd.get('cefr')||'';
    s.isMinor = fd.get('isMinor')==='on';
    s.guardianName = fd.get('guardianName')||'';
    s.guardianPhone = fd.get('guardianPhone')||'';
    s.status = fd.get('status');
    s.pricingType = fd.get('pricingType');
    s.rate = fd.get('rate') ? Number(fd.get('rate')) : '';
    s.packageSize = fd.get('packageSize') ? Number(fd.get('packageSize')) : '';
    s.packagePrice = fd.get('packagePrice') ? Number(fd.get('packagePrice')) : '';
    s.notes = fd.get('notes')||'';
    s.startDate = s.startDate || todayStr();
    s.pinnedSkills = s.pinnedSkills || [];

    const slotDays = fd.getAll('slotDay');
    const slotTimes = fd.getAll('slotTime');
    const slotDurations = fd.getAll('slotDuration');
    const slots = slotDays.map((dval,i)=>({
      weekday: Number(dval),
      time: slotTimes[i]||'',
      duration: Number(slotDurations[i])||60
    }));
    s.recurring = slots.length ? slots : null;
    // Always rebuild future auto-scheduled placeholders: clears them when
    // paused/inactive/recurring-off, refreshes them when the pattern changed.
    // Lessons manually rescheduled (date changed by hand) are detached from
    // isRecurring below, so this never touches those.
    regenerateRecurring(s);

    saveState(); closeOverlay(); renderAll();
    toast(isNew ? 'Student added.' : 'Student updated.');
    return;
  }

  if(kind==='lesson'){
    const id = form.dataset.id;
    let l = state.lessons.find(x=>x.id===id);
    const isNew = !l;
    if(isNew){ l = { id, isRecurring:false }; state.lessons.push(l); }
    const oldDate = l.date;
    l.studentId = fd.get('studentId');
    l.date = fd.get('date');
    l.time = fd.get('time')||'';
    l.duration = Number(fd.get('duration'))||60;
    l.status = fd.get('status');
    l.notes = fd.get('notes')||'';
    if(!isNew && l.date !== oldDate){ l.isRecurring = false; }
    if(!l.studentId){ toast('Pick a student.', true); state.lessons = state.lessons.filter(x=>x.id!==id); return; }
    saveState(); closeOverlay(); renderAll();
    toast(isNew ? 'Lesson added.' : 'Lesson updated.');
    return;
  }

  if(kind==='payment'){
    const id = form.dataset.id;
    let p = state.payments.find(x=>x.id===id);
    const isNew = !p;
    if(isNew){ p = { id }; state.payments.push(p); }
    p.studentId = fd.get('studentId');
    p.date = fd.get('date');
    p.amount = Number(fd.get('amount'))||0;
    p.method = fd.get('method');
    p.notes = fd.get('notes')||'';
    if(!p.studentId){ toast('Pick a student.', true); state.payments = state.payments.filter(x=>x.id!==id); return; }
    saveState(); closeOverlay(); renderAll();
    toast(isNew ? 'Payment logged.' : 'Payment updated.');
    return;
  }

  if(kind==='checkpoint'){
    const id = form.dataset.id;
    const studentId = form.dataset.student;
    let c = state.checkpoints.find(x=>x.id===id);
    const isNew = !c;
    if(isNew){ c = { id, studentId }; state.checkpoints.push(c); }
    c.date = fd.get('date');
    c.notes = fd.get('notes')||'';
    c.grades = {};
    SKILLS.forEach(sk=>{
      const v = fd.get('grade_'+sk.key);
      if(v) c.grades[sk.key] = v;
    });
    saveState(); renderAll();
    openStudentPanel(studentId);
    toast(isNew ? 'Checkpoint added.' : 'Checkpoint updated.');
    return;
  }

  if(kind==='learningPoint'){
    const id = form.dataset.id;
    const studentId = form.dataset.student;
    let p = state.learningPoints.find(x=>x.id===id);
    const isNew = !p;
    if(isNew){ p = { id, studentId }; state.learningPoints.push(p); }
    p.topic = (fd.get('topic')||'').trim();
    p.skill = fd.get('skill');
    p.grade = fd.get('grade')||'';
    p.dateIntroduced = fd.get('dateIntroduced');
    p.notes = fd.get('notes')||'';
    const wasComplete = p.complete;
    p.complete = fd.get('complete')==='on';
    if(p.complete && !wasComplete && !p.dateCompleted){ p.dateCompleted = todayStr(); }
    if(!p.complete){ p.dateCompleted = ''; }
    saveState(); renderAll();
    openStudentPanel(studentId);
    toast(isNew ? 'Learning point added.' : 'Learning point updated.');
    return;
  }

  if(kind==='settings'){
    state.settings.overdueThresholdDays = Number(fd.get('overdueThresholdDays'))||14;
    saveState(); closeOverlay(); renderAll();
    toast('Settings saved.');
    return;
  }
});

document.getElementById('overlay').addEventListener('click', function(e){
  if(e.target.id==='overlay') closeOverlay();
});
document.addEventListener('keydown', function(e){
  if(e.key==='Escape') closeOverlay();
});

/* =========================================================
   EXPORT / IMPORT
   ========================================================= */
function exportData(){
  const blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'private-lessons-backup-' + todayStr() + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast('Backup downloaded.');
}

/* =========================================================
   INIT
   ========================================================= */
topUpAllRecurring();
saveState();
renderAll();
</script>
